[project]
name = "senai-prescriptive-maintenance"
version = "0.1.0"
description = "Fundação do monorepo para manutenção prescritiva."
readme = "README.md"
authors = [
  { name = "Renan Mocelin", email = "renanryuakame@gmail.com" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "prescriptive-maintenance-api",
]

[dependency-groups]
dev = [
  "httpx2>=2.12.0,<3.0.0",
  "matplotlib>=3.11.1,<3.12",
  "pandas-stubs==3.0.5.260730",
  "poethepoet>=0.46.0,<0.47.0",
  "pre-commit>=4.6.2,<5.0.0",
  "pyright>=1.1.411,<2.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.16.4,<1.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
prescriptive-maintenance-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/api"]

[tool.poe]
executor = { type = "uv", frozen = true }

# Poe 0.46 ignores free arguments on sequences unless a subtask consumes them.
# Expanding a fixed invalid option keeps sequence interfaces closed and fail-fast.
[tool.poe.tasks.setup]
help = "Prepara dependências e hooks; não aceita argumentos adicionais."
sequence = [
  { cmd = "uv sync --all-packages --frozen ${POE_EXTRA_ARGS:+--poe-task-does-not-accept-arguments}" },
  { cmd = "corepack pnpm install --frozen-lockfile", executor = { type = "simple" } },
  { cmd = "pre-commit install --install-hooks" },
]

[tool.poe.tasks.format]
help = "Aplica correções e formata com Ruff; não aceita argumentos adicionais."
sequence = [
  { cmd = "ruff check . --fix ${POE_EXTRA_ARGS:+--poe-task-does-not-accept-arguments}" },
  { cmd = "ruff format ." },
]

[tool.poe.tasks.format-check]
help = "Verifica a formatação Ruff sem alterar arquivos."
cmd = "ruff format --check ."

[tool.poe.tasks.lint]
help = "Executa o lint Ruff sem aplicar correções."
cmd = "ruff check ."

[tool.poe.tasks.typecheck]
help = "Executa a verificação de tipos Pyright em modo estrito."
cmd = "pyright"

[tool.poe.tasks.test]
help = "Executa os testes Pytest com cobertura."
cmd = "pytest"

[tool.poe.tasks.check]
help = "Executa todos os checks; não aceita argumentos adicionais."
sequence = [
  "format-check ${POE_EXTRA_ARGS:+--poe-task-does-not-accept-arguments}",
  "lint",
  "typecheck",
  "test",
]

[tool.poe.tasks.golden-e2e]
help = "Executa o golden set sintético dos cinco estados e do ciclo documental."
script = "scripts.product_golden:main()"

[tool.poe.tasks.public-repository-audit]
help = "Audita nomes e fingerprints protegidos somente nos objetos Git públicos."
cmd = "python -m scripts.public_repository_audit ${POE_EXTRA_ARGS:+--poe-task-does-not-accept-arguments}"

[tool.poe.tasks.failure-matrix]
help = "Executa a matriz SEN-66 e a auditoria sanitizada do repositório público."
sequence = [
  { cmd = "pytest --no-cov -m failure_matrix ${POE_EXTRA_ARGS:+--poe-task-does-not-accept-arguments}" },
  "public-repository-audit",
]

[tool.poe.tasks.data-build]
help = "Constrói o dataset canônico local em destino explícito."
cmd = "python -m prescriptive_maintenance.data.cli build --input ${input} --manifest ${manifest} --inventory ${inventory} --baseline-json ${baseline_json} --baseline-markdown ${baseline_markdown} --lock ${lock} --output ${output}"
args = [
  { name = "input", options = ["--input"], required = true },
  { name = "manifest", options = ["--manifest"], required = true },
  { name = "inventory", options = ["--inventory"], required = true },
  { name = "baseline_json", options = ["--baseline-json"], required = true },
  { name = "baseline_markdown", options = ["--baseline-markdown"], required = true },
  { name = "lock", options = ["--lock"], required = true },
  { name = "output", options = ["--output"], required = true },
]

[tool.poe.tasks.data-check]
help = "Verifica manifesto, reconciliações e gates locais sem reescrever."
cmd = "python -m prescriptive_maintenance.data.cli check --manifest ${manifest} --inventory ${inventory} --baseline-json ${baseline_json} --baseline-markdown ${baseline_markdown} --lock ${lock} --output ${output}"
args = [
  { name = "manifest", options = ["--manifest"], required = true },
  { name = "inventory", options = ["--inventory"], required = true },
  { name = "baseline_json", options = ["--baseline-json"], required = true },
  { name = "baseline_markdown", options = ["--baseline-markdown"], required = true },
  { name = "lock", options = ["--lock"], required = true },
  { name = "output", options = ["--output"], required = true },
]

[tool.poe.tasks.hooks]
help = "Executa os guardrails pre-commit em todos os arquivos."
cmd = "pre-commit run --all-files"

[tool.poe.tasks.services-up]
help = "Inicia o PostgreSQL local e aguarda o healthcheck."
cmd = "docker compose up --detach --wait postgres"

[tool.poe.tasks.applications-build]
help = "Constrói as imagens locais da API e da web pelos locks congelados."
cmd = "docker compose build api web"

[tool.poe.tasks.applications-audit]
help = "Audita os contextos Docker reais e os filesystems dos builders."
script = "scripts.container_audit:main()"

[tool.poe.tasks.applications-up]
help = "Inicia PostgreSQL, API e web e aguarda todos os healthchecks."
cmd = "docker compose up --detach --build --wait postgres api web"

[tool.poe.tasks.services-down]
help = "Remove contêiner e rede locais, preservando o volume."
cmd = "docker compose down"

[tool.poe.tasks.smoke]
help = "Valida runtimes, configuração, liveness e readiness offline; banco é opcional."
script = "scripts.smoke:main(with_services, with_applications, environ.get('POE_EXTRA_ARGS'))"
args = [
  { name = "with_services", options = ["--with-services"], type = "boolean", help = "Verifica o PostgreSQL já iniciado e o pgvector." },
  { name = "with_applications", options = ["--with-applications"], type = "boolean", help = "Verifica API, web e OpenAPI v1 em contêineres já iniciados." },
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pytest relies on plain assertions to provide introspective failure messages.
"apps/api/tests/**/*.py" = ["S101"]

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
include = ["apps/api/src", "apps/api/tests", "scripts"]
extraPaths = ["apps/api/src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=prescriptive_maintenance",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "failure_matrix: regressões P0/P1 da matriz de falha segura SEN-66",
]
testpaths = ["apps/api/tests"]

[tool.coverage.run]
branch = true
source = ["prescriptive_maintenance"]

[tool.coverage.report]
fail_under = 80
show_missing = true
