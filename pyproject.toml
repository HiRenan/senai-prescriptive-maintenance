[project]
name = "senai-prescriptive-maintenance"
version = "0.1.0"
description = "Fundação do monorepo para manutenção prescritiva."
readme = "README.md"
authors = [
  { name = "Renan Mocelin", email = "renanryuakame@gmail.com" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "prescriptive-maintenance-api",
]

[dependency-groups]
dev = [
  "poethepoet>=0.46.0,<0.47.0",
]

[tool.uv]
package = false

[tool.uv.sources]
prescriptive-maintenance-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/api"]

[tool.poe]
executor = { type = "uv" }

[tool.poe.tasks.check-api-import]
help = "Confirma que o pacote instalável do backend pode ser importado."
cmd = "python -c \"import prescriptive_maintenance\""
