services:
  api:
    image: prescriptive-maintenance-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PRESCRIPTIVE_MAINTENANCE_DATABASE_URL: postgresql://prescriptive_maintenance:local_only_change_me@postgres:5432/prescriptive_maintenance
      PRESCRIPTIVE_MAINTENANCE_ENVIRONMENT: local
      PRESCRIPTIVE_MAINTENANCE_PERSISTENCE_BACKEND: postgres
    ports:
      - "127.0.0.1:${PRESCRIPTIVE_MAINTENANCE_API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: prescriptive_maintenance
      POSTGRES_USER: prescriptive_maintenance
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:${PRESCRIPTIVE_MAINTENANCE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./infra/postgres/init/001-enable-vector.sql
        target: /docker-entrypoint-initdb.d/001-enable-vector.sql
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host=127.0.0.1 --username=prescriptive_maintenance
          --dbname=prescriptive_maintenance
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    image: prescriptive-maintenance-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${PRESCRIPTIVE_MAINTENANCE_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
