name: Pull Request Policy

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pull-request-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Policy / Title and branch origin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Test policy automation
        run: node --test .github/scripts/pull-request-policy.test.js

      - name: Validate metadata and release integrity
        run: node .github/scripts/pull-request-policy.js
