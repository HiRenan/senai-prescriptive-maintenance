name: AWS demo offline validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/aws-demo-*.yml"
      - "apps/api/openapi/v1.json"
      - "apps/web/**"
      - "docs/**"
      - "infra/aws/demo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
      - "scripts/generate_web_contract.py"
      - "uv.lock"

permissions: {}

concurrency:
  group: aws-demo-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-policy:
    name: AWS demo / Offline policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Terraform 1.15.9
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Build the frontend bundle audited by the delivery grammar
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @senai-prescriptive-maintenance/web build

      - name: Validate Terraform and delivery policies offline
        shell: bash
        run: |
          set -euo pipefail
          plan_json="$(mktemp)"
          trap 'rm -f -- "$plan_json"' EXIT
          terraform -chdir=infra/aws/demo fmt -check -recursive
          python infra/aws/demo/scripts/static_plan.py \
            --terraform "$(command -v terraform)" \
            --plan-json "$plan_json"
          python infra/aws/demo/scripts/plan_audit.py "$plan_json"
          python infra/aws/demo/scripts/security_regression.py "$plan_json"
          python infra/aws/demo/scripts/delivery_policy.py
          python infra/aws/demo/scripts/delivery_regression.py
          python infra/aws/demo/scripts/frontend_delivery_regression.py
